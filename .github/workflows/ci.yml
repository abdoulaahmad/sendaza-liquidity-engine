name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sle
          POSTGRES_PASSWORD: sle_ci_password
          POSTGRES_DB: sle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sle -d sle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://sle:sle_ci_password@127.0.0.1:5432/sle_test
      TEST_DATABASE_URL: postgresql://sle:sle_ci_password@127.0.0.1:5432/sle_test
      SLE_INTEGRATION_SUITE_TIMEOUT_MS: '180000'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Verify registry seed
        run: pnpm exec prisma db execute --file prisma/checks/registry_seed.sql

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test with PostgreSQL
        run: pnpm test:integration

      - name: Build
        run: pnpm build
